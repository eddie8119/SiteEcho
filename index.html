  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script src="https://unpkg.com/vconsole@latest/dist/vconsole.min.js"></script>
    <script type="module">
      import { deleteOrphanPhotosFromIndexedDB } from '/src/utils/indexedDB.js';

      // Initialize vconsole for mobile debugging (only in development)
      // Set to true to enable vConsole button
      const ENABLE_VCONSOLE = false;
      if (window.VConsole && import.meta.env.DEV && ENABLE_VCONSOLE) {
        new window.VConsole();
      }

      // Expose cleanup function to window for easy access in console
      window.cleanupOrphanPhotos = async () => {
        try {
          const count = await deleteOrphanPhotosFromIndexedDB();
          alert(`已清理 ${count} 張孤兒照片`);
          location.reload();
        } catch (error) {
          alert('清理失敗: ' + error);
        }
      };
    </script>
